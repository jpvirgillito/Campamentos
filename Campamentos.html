<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapa de Campamentos</title>

    <!-- Estilos -->
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            right: 0;
            left: 0;
        }
        .leaflet-container {
            font-size: 1rem;
        }
    </style>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.2.0/css/all.min.css"/>
</head>
<body>
    <div id="map"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.js"></script>

    <script>
        // Configuración inicial del mapa
        const map = L.map('map').setView([-35.64666666666667, -69.90944444444445], 8);

        // Capa base de OpenStreetMap
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19,
            minZoom: 0
        }).addTo(map);

        // ============================================
        // Punto 1: Río Diamante
        // ============================================
        const markerRioDiamante = L.marker([-34.638, -69.181]).addTo(map);

        markerRioDiamante.bindPopup(`
            <div style="width: 100%; height: 100%;">
                <strong>Noche 5 abril</strong>
            </div>
        `);

        markerRioDiamante.bindTooltip(`
            <div>
                Río Diamante
            </div>
        `, { sticky: true });

        // ============================================
        // Punto 2: El Sosneado
        // ============================================
        const markerElSosneado = L.marker([-35.083, -69.603]).addTo(map);

        markerElSosneado.bindPopup(`
            <div style="width: 100%; height: 100%;">
                <strong>El Sosneado</strong>
            </div>
        `);

        markerElSosneado.bindTooltip(`
            <div>
                El Sosneado
            </div>
        `, { sticky: true });

        // ============================================
        // Punto 3: Río Malargüe
        // ============================================
        const markerRioMalargue1 = L.marker([-35.544, -69.594]).addTo(map);

        markerRioMalargue1.bindPopup(`
            <div style="width: 100%; height: 100%;">
                <strong>Río Malargüe</strong>
            </div>
        `);

        markerRioMalargue1.bindTooltip(`
            <div>
                Río Malargüe
            </div>
        `, { sticky: true });

        // ============================================
        // Punto 4: Bardas Blancas
        // ============================================
        const markerBardasBlancas = L.marker([-35.860, -69.807]).addTo(map);

        markerBardasBlancas.bindPopup(`
            <div style="width: 100%; height: 100%;">
                <strong>Bardas Blancas</strong>
            </div>
        `);

        markerBardasBlancas.bindTooltip(`
            <div>
                Bardas Blancas
            </div>
        `, { sticky: true });

        
         // ============================================
        // Punto 5: Río Grande
        // ============================================
        const markerRioGrande = L.marker([-36.333, -69.672]).addTo(map);

        markerRioGrande.bindPopup(`
            <div style="width: 100%; height: 100%;">
                <strong> Noche 10 de abril</strong>
            </div>
        `);

        markerRioGrande.bindTooltip(`
            <div>
                Río Grande
            </div>
        `, { sticky: true });

    </script>
</body>
</html>
